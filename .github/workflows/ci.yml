name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned: Playwright 1.50.1 does not support Ubuntu 26.04 (ubuntu-latest moved in Nov 2026). Unpin after upgrading Playwright.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dev vars for stub auth e2e
        run: |
          printf '%s\n' \
            'ENVIRONMENT=development' \
            'APP_BASE_URL=http://127.0.0.1:8787' \
            'SESSION_SECRET=ci-test-secret-min-16' \
            'DEV_STUB_AUTH=true' \
            'ADMIN_EMAILS=mica@example.test' \
            'GOOGLE_CLIENT_ID=e2e-test-client' \
            'GOOGLE_CLIENT_SECRET=e2e-test-secret' \
            > .dev.vars

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E (resets local D1, then Playwright)
        run: npm run test:e2e
        env:
          CI: "true"
