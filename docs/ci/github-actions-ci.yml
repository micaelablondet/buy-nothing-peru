# Canonical CI lives at `.github/workflows/ci.yml`. This copy is for reference.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned: Playwright 1.50.1 does not support Ubuntu 26.04 (ubuntu-latest moved in Nov 2026). Unpin after upgrading Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          printf '%s\n' \
            'ENVIRONMENT=development' \
            'APP_BASE_URL=http://127.0.0.1:8787' \
            'SESSION_SECRET=ci-test-secret-min-16' \
            'DEV_STUB_AUTH=true' \
            'ADMIN_EMAILS=mica@example.test' \
            'GOOGLE_CLIENT_ID=' \
            'GOOGLE_CLIENT_SECRET=' \
            > .dev.vars
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: "true"
