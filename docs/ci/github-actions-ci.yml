# Canonical CI lives at `.github/workflows/ci.yml`. This copy is for reference.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:reset:local
      - run: |
          printf '%s\n' \
            'SESSION_SECRET=ci-test-secret-min-16' \
            'DEV_STUB_AUTH=true' \
            'GOOGLE_CLIENT_ID=' \
            'GOOGLE_CLIENT_SECRET=' \
            > .dev.vars
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: "true"
