# Barrio — Cloudflare Worker.
# [vars] are production values. Local overrides live in .dev.vars (see .dev.vars.example).
# After `npx wrangler d1 create barrio`, paste the real database_id below.

name = "barrio"
main = "worker/index.ts"
compatibility_date = "2025-11-01"
account_id = "ea3b14ec9990cf47cebe6c64f89659b9"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Wrangler 3.99 ignores run_worker_first (needs 4.20+) and, with
# not_found_handling = "single-page-application", serves index.html for
# /api/* and /p/* before the Worker. Use "none" so those hit the Worker;
# app.get("*") serves file assets and SPA-falls-back for app routes.
# html_handling = "none" avoids ASSETS 307s (e.g. /entrar → /) that would
# skip the catch-all SPA fallback.
not_found_handling = "none"
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "barrio"
database_id = "4c972659-50cd-4431-b170-9db31ea28139"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "barrio-photos"
preview_bucket_name = "barrio-photos-preview"

[vars]
APP_NAME = "Barrio"
INVITE_REQUIRED = "true"
ENVIRONMENT = "production"
APP_BASE_URL = "https://barrio.mica-ea3.workers.dev"
# Secrets (wrangler secret / .dev.vars): SESSION_SECRET, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, ADMIN_EMAILS (AUTH-04 — never commit emails here)
# Never set DEV_STUB_AUTH in production secrets. Stub auth is gated off when
# ENVIRONMENT=production (see worker/lib/stubAuth.ts).

# POST-06: expire open posts past expires_at (idempotent)
[triggers]
crons = ["0 * * * *"]
