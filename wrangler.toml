# Barrio — Cloudflare Worker (M0 foundation)
# Replace database_id / account after `wrangler d1 create barrio` (see docs/m0-setup.md).

name = "barrio"
main = "worker/index.ts"
compatibility_date = "2025-11-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "barrio"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "barrio-photos"
preview_bucket_name = "barrio-photos-preview"

[vars]
APP_NAME = "Barrio"
INVITE_REQUIRED = "true"
ENVIRONMENT = "development"
APP_BASE_URL = "http://127.0.0.1:8787"
ADMIN_EMAILS = "mica@valere.io"
# Secrets (wrangler secret / .dev.vars): SESSION_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# Optional local: DEV_STUB_AUTH=true
